server {
    listen localhost:1;
    server_name localhost;
    root ./www;
    index index.html;
    autoindex off;

    error_page 405 /errors/405.html;
    error_page 403 /errors/403.html;
    error_page 500 /errors/500.html;
    # Location par défaut
    location / {
        #autoindex on;
        index index.html;
        allow_methods GET DELETE POST;
    }

    location /files {
        return 405;
        autoindex on;
        allow_methods POST;
    }

    location secret/ {
        return 50 /errors/500.html
    }

    location /cgi-bin {
        allow_methods GET POST;
        index test.py;
        cgi_handler .py /usr/bin/python3;
    }
    
    # Upload de fichiers
    location /upload {
        allow_methods POST DELETE;
        upload_store ./www/uploads;
        client_max_body_size 1000M;
    }
    
    # Suppression de fichiers
    location /uploads {
        allow_methods GET DELETE;
        autoindex on;
    }
}

server {
    listen localhost:1;
    server_name bratan;
    root ./www;
    
    # Location par défaut
    location / {
