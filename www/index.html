<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Serveur</title>
    <style>
        body {
            background-image: url('/../images/IMG_3284.GIF');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Test de requêtes serveur</h1>
    
    <form id="testForm">
        <label>Requête HTTP complète:</label><br>
        <textarea id="httpRequest" rows="10" cols="80">

</textarea><br><br>
        
        <button type="submit">Envoyer</button>
    </form>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const httpRequest = document.getElementById('httpRequest').value;
            
            // Parser la première ligne pour extraire l'URL
            const lines = httpRequest.split('\n');
            const requestLine = lines[0].trim().split(' ');
            const path = requestLine[1] || '/';
            
            // Extraire le Host
            let host = 'localhost:8080';
            for (let line of lines) {
                if (line.toLowerCase().startsWith('host:')) {
                    host = line.substring(5).trim();
                    break;
                }
            }
            
            // Construire l'URL complète
            const url = `http://${host}${path}`;
            
            // Rediriger vers l'URL (remplace la page actuelle)
            window.location.href = url;
        });
    </script>
</body>
</html>
