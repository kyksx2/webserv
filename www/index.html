<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>HTTP Raw Tester</title>
    <style>
        body { font-family: monospace; padding: 20px; background-color: #f0f0f0; }
        .box { background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        textarea { width: 100%; font-family: monospace; padding: 10px; border: 1px solid #ccc; }
        button { margin: 10px 0; padding: 10px 20px; cursor: pointer; background: #333; color: white; border: none; }
        #response { background: #222; color: #fff; padding: 15px; white-space: pre-wrap; min-height: 200px; border-radius: 3px; }
        .label { font-weight: bold; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <div class="box">
        <span class="label">Requête :</span>
        <textarea id="requestInput" rows="10">
POST /cgi-bin/test_post.py HTTP/1.1
Content-Type: application/x-www-form-urlencoded

nom=valeur&test=ok</textarea>

        <button onclick="sendRequest()">Envoyer la requête</button>

        <span class="label">Réponse du serveur :</span>
        <div id="response">Le résultat s'affichera ici.</div>
    </div>

    <script>
        async function sendRequest() {
            const raw = document.getElementById('requestInput').value;
            const display = document.getElementById('response');
            
            // 1. Parsing minimal de la requête brute
            const lines = raw.split('\n');
            const firstLine = lines[0].split(' ');
            if (firstLine.length < 2) {
                display.textContent = "Erreur : Première ligne invalide.";
                return;
            }

            const method = firstLine[0];
            const url = firstLine[1];

            // 2. Séparation Headers / Body
            const parts = raw.split(/\n\s*\n/);
            const headersRaw = parts[0].split('\n').slice(1);
            const body = parts.length > 1 ? parts.slice(1).join('\n\n').trim() : null;

            const headers = {};
            headersRaw.forEach(line => {
                const index = line.indexOf(':');
                if (index !== -1) {
                    headers[line.substring(0, index).trim()] = line.substring(index + 1).trim();
                }
            });

            display.textContent = "Envoi en cours...";

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: headers,
                    body: (method !== 'GET' && method !== 'HEAD') ? body : null
                });

                const responseText = await response.text();
                
                // Reconstruction de l'affichage de la réponse brute
                let fullResponse = `HTTP/1.1 ${response.status} ${response.statusText}\n`;
                response.headers.forEach((v, k) => {
                    fullResponse += `${k}: ${v}\n`;
                });
                fullResponse += '\n' + responseText;

                display.textContent = fullResponse;
            } catch (err) {
                display.textContent = "Erreur : " + err.message;
            }
        }
    </script>
</body>
</html>
