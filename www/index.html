<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Serveur</title>
    <style>
        body {
            background-image: url('/../images/MIB_web.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
        }

        h1, h2, label {
            color: white;
        }
        button {
            color: black;
        }
        #response {
            color: white;
        }
    </style>
</head>
<body>
    <h1>Test de requêtes serveur</h1>
    
    <form id="testForm">
        <label>Requête HTTP complète:</label><br>
        <textarea id="httpRequest" rows="10" cols="80">

</textarea><br><br>
        
        <button type="submit">Envoyer</button>
        <button type="button" onclick="showInPage()">Afficher dans la page</button>
    </form>
    
    <hr>
    
    <h2>Réponse du serveur:</h2>
    <pre id="response"></pre>
    
<script>
    document.getElementById('testForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const httpRequest = document.getElementById('httpRequest').value;
        const lines = httpRequest.split('\n');
        const requestLine = lines[0].trim().split(' ');
        const path = requestLine[1] || '/';
        
        let host = 'localhost:8080';
        for (let line of lines) {
            if (line.toLowerCase().startsWith('host:')) {
                host = line.substring(5).trim();
                break;
            }
        }
        
        const url = `http://${host}${path}`;
        window.location.href = url;
    });
    
    async function showInPage() {
        const httpRequest = document.getElementById('httpRequest').value;
        const responseDiv = document.getElementById('response');
        
        // Séparer headers et body (séparés par une ligne vide)
        const parts = httpRequest.split(/\r?\n\r?\n/);
        const headerSection = parts[0];
        const body = parts.slice(1).join('\n\n') || null;
        
        const lines = headerSection.split('\n');
        const requestLine = lines[0].trim().split(' ');
        const method = requestLine[0];
        const path = requestLine[1] || '/';
        
        // Extraire le Host et les autres headers
        let host = 'localhost:8080';
        const headers = {};
        
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            const colonIndex = line.indexOf(':');
            if (colonIndex === -1) continue;
            
            const key = line.substring(0, colonIndex).trim();
            const value = line.substring(colonIndex + 1).trim();
            
            if (key.toLowerCase() === 'host') {
                host = value;
            } else {
                // On ignore Content-Length, fetch le calcule tout seul
                if (key.toLowerCase() !== 'content-length') {
                    headers[key] = value;
                }
            }
        }
        
        const url = `http://${host}${path}?_=${Date.now()}`;
        responseDiv.textContent = 'Chargement...\n';
        
        try {
            const options = { 
                method, 
                headers: {
                    ...headers,
                    'Cache-Control': 'no-cache',
                    'Pragma': 'no-cache'
                }
            };
            
            // Ajouter le body uniquement si la méthode le permet
            if (!['GET', 'HEAD'].includes(method.toUpperCase()) && body) {
                options.body = body;
            }
            
            const response = await fetch(url, options);
            const text = await response.text();
            
            responseDiv.textContent = `Status: ${response.status} ${response.statusText}\n\n`;
            responseDiv.textContent += text;
        } catch (error) {
            responseDiv.textContent = `ERREUR: ${error.message}`;
        }
    }
</script>
</body>
</html>
